name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite drives real commits between two working copies.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned on purpose. An unpinned linter means the enforced ruleset can
      # change with no commit behind it — that turned a sibling repo's main red
      # with 476 findings across code nobody had touched (2026-07-31).
      - run: pip install "ruff==0.14.2"
      - run: ruff check src tests
